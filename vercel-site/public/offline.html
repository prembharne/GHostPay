<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080809"><title>GhostPay — reconnect to continue</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:32px;display:grid;place-items:center;background:#080809;color:#f0f0ed;font:16px/1.7 system-ui,sans-serif}main{width:100%;max-width:420px}img{width:64px;height:64px;border-radius:20px;margin-bottom:26px}small{color:#a3a3af;letter-spacing:2px;font-size:11px}h1{font-size:clamp(32px,9vw,46px);font-weight:450;letter-spacing:-1.6px;line-height:1.15;margin:18px 0}p{color:#a8a8b3;font-size:15px}a,button{font:inherit;display:block;width:100%;min-height:48px;padding:12px 18px;text-align:center;border:1px solid #ffffff30;border-radius:18px;margin-top:14px;color:#eee;background:#18181b;text-decoration:none;cursor:pointer}a{background:#e8e8e6;color:#111}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:5px}.note{font-size:12px;border-top:1px solid #ffffff20;padding-top:22px;margin-top:28px}</style></head><body><main><img src="/icons/ghostpay-192.png" alt="GhostPay"><small>A LITTLE PAUSE</small><h1>Let’s get you<br>connected again.</h1><p>This screen needs a live connection. Reconnect before checking balances, sending a payment or claiming funds.</p><button id="retry">Try again</button><a href="/chat">Open saved app</a><p class="note">Nothing is submitted or queued in the background. Previously opened conversations may be available on this device.</p></main><script src="/offline-retry.js"></script></body></html>
